# Local development overrides - hot reload, exposed ports, local builds
services:
  traefik:
    ports:
      - "8090:8080"  # Traefik dashboard

  frontend:
    build:
      context: ./frontend
      target: dev
    image: wordblitz-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    labels:
      - "traefik.enable=false"
