http:
  routers:
    # HTTP router — works by IP or any hostname (local access)
    frontend-http:
      entryPoints: [web]
      rule: 'PathPrefix("/")'
      service: frontend
      priority: 1

    # HTTPS router — domain + Let's Encrypt
    frontend:
      entryPoints: [websecure]
      rule: 'Host("{{ env "DOMAIN" }}")'
      service: frontend
      tls:
        certResolver: letsencrypt

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://wordblitz-frontend:5173"
