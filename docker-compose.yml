services:
  traefik:
    image: traefik:v3.3
    container_name: wordblitz-traefik
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - wordblitz-net

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/${GITHUB_REPOSITORY:-mikkelgn/website}/frontend:${IMAGE_TAG:-latest}
    container_name: wordblitz-frontend
    restart: unless-stopped
    networks:
      - wordblitz-net

  watchtower:
    image: containrrr/watchtower
    container_name: wordblitz-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.41"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/migini/.docker/config.json:/config.json:ro
    command: wordblitz-frontend

networks:
  wordblitz-net:
    driver: bridge
